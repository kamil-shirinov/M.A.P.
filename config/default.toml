# M.A.P. — default configuration
#
# This file is the ONLY place a backend vendor may be named (CLAUDE.md §3).
# Switching from one OpenAI-compatible server to another is a change to
# `inference.base_url` and the three model aliases. It is never a code change.
#
# Every value here can be overridden by an environment variable prefixed MAP_,
# nested with __ — e.g. MAP_INFERENCE__BASE_URL, MAP_DATA__SEC__USER_AGENT.

[inference]
# LM Studio: http://localhost:1234/v1   ·   Ollama: http://localhost:11434/v1
base_url = "http://localhost:1234/v1"
# Connect and read are separate on purpose (ADR 0008). A connect failure means the
# server is down; a read timeout on this hardware usually means a cold model load.
# Collapsing them into one number makes those indistinguishable.
connect_timeout_s = 10.0     # the server is local; if it will not accept a socket in
                             #   ten seconds it is not running
read_timeout_s = 1300.0      # generous by design, and now derived rather than guessed.
                             #   The analyst must be able to spend its whole budget inside
                             #   this window; see the arithmetic under min_tokens_per_second.
                             #   A model swap can add 30 s or more before the first token.

# The hardware assumption that couples max_tokens to read_timeout_s. They are set
# independently and mean nothing to each other, but a budget the model cannot
# finish spending before the timeout fires is not a budget: a run that reached it
# would fail as a timeout and send you hunting for a cold model load that never
# happened. Startup validation rejects an inconsistent pair.
# Reference machine: Apple M1, 16 GB. MEASURED at 16.0 tok/s on the 12B analyst,
# warm, on 2026-08-12 — not an estimate. 12.0 is set below that as margin for a
# cold cache and a longer context. Someone on different hardware must re-measure:
# time a generation of known token count and divide.
min_tokens_per_second = 12.0
budget_margin = 0.8          # a full budget may consume at most this share of the
                             #   read timeout; the rest covers prompt processing
                             #   and a cold model load
max_repair_attempts = 3      # Agent 3 only. On exhaustion: typed exception, never a
                             #   partial or coerced Forecast

# Set true ONLY to run Agents 1 or 3 with sampling. Permitted, but warned about at
# startup and recorded in every run manifest, because it makes runs unreproducible.
# Phase 3 self-consistency ensembling targets Agent 2, which is already free to
# sample — so this should rarely be needed. See ADR 0007.
[models]
allow_nondeterministic = false

# ---------------------------------------------------------------------------
# Model registry (CLAUDE.md §5)
#
# `alias` is what this config asks for. The id actually sent on the wire is
# resolved at startup from GET /v1/models — never hardcoded, because LM Studio and
# Ollama name identical weights differently. `map health` reports any alias that
# does not resolve, and fails fast with an actionable message.
# ---------------------------------------------------------------------------
# The aliases below are the ids VERIFIED on the reference machine (LM Studio,
# 2026-08-11). They are backend-specific by nature: the same weights are named
# differently by different servers, which is exactly why the alias exists as an
# adaptation point rather than being hardcoded in the agents.
#
# They live in this committed file, not in local.toml, for the same reason
# base_url does: a fresh clone should reach a working `map health` rather than a
# config full of placeholders, and a committed value documents what the project
# was actually run against. Override without dirtying the tree by putting your own
# in config/local.toml (gitignored) or MAP_MODELS__<AGENT>__ALIAS.
#
# Naming differs by backend. LM Studio uses `publisher/model-name`; Ollama uses
# `name:tag`. Do not guess the other server's strings — `map health` prints what
# the running server actually reports, and resolution is exact-match only, because
# a near-miss that silently loads different weights produces a complete, valid,
# wrong forecast.

[models.intake]
alias = "llama-3.2-3b-instruct"
temperature = 0.0            # CLAUDE.md §6 — deterministic where the backend honours it
# Capped because intake's job is to COMPRESS and nothing made it. On STZ it emitted
# ~20,000 tokens from a 12,500-token document and the analyst rejected the result.
# The ceiling is derived from the next window, not chosen: the analyst can accept
# 4,384 tokens (16,384 less its 12,000 budget), of which 1,536 is its own template,
# leaving 2,848. 2,048 keeps 800 in hand and is still 5.5x the largest output ever
# observed (368). A startup validator now checks the whole chain.
max_tokens = 2048
# The agent that reads exhibits, so the one that needs the room. Item 2.02 releases
# run to a median ~8.6k tokens and a maximum ~59k; 32768 admits 698 of 709 whole
# (ADR 0020). Llama 3.2 has no sliding-window attention, so every layer's KV cache
# scales with this: 112 KB/token, 3.76 GB at 32768. Set it in LM Studio too — this
# number is checked against the server, never trusted (ADR 0020 §4).
context_tokens = 32768

[models.analyst]
alias = "google/gemma-4-12b-qat"
temperature = 0.7            # the one agent where sampling diversity is wanted
# Must exceed max_tokens below, or the budget is unreachable and the model stops at
# the context ceiling while reporting budget exhaustion. That is exactly how the
# first corpus run failed on TSLA. A startup validator now rejects the pair.
#
# 16384, not the 32768 the architecture suggests. Gemma 4 keeps 40 of 48 layers on a
# 1024 window, which WOULD make 32768 cost 0.87 GB — but the runtime allocates full
# KV for every layer regardless, about 336 KB/token, and refused to load at 32768.
# Verified by bracketing rather than assumed (ADR 0020 §4). The analyst needs ~13,600
# tokens (1,598 max observed prompt + a 12,000 budget); 16384 leaves 17% margin.
context_tokens = 16384
# What reaches the structuralist is the narrative, not the reasoning: 565 visible
# tokens against 5,329 of reasoning in one measured run, 1,623 visible at most.
# Declared at 4096 — 2.5x the observed maximum, and inside the 5,424 the
# structuralist can accept — so the chain check uses a bound that reflects what
# actually crosses the boundary rather than the whole generation budget.
max_visible_tokens = 4096
seed = 20260809              # recorded as *requested*; many local backends ignore it
# Explicit, because the server default is invisible and this build reasons before
# it answers: on 2026-08-12 it spent an entire ~7000-token default budget thinking
# and emitted nothing. A configured ceiling makes the failure reproducible and the
# fix a config edit rather than a mystery.
#
# 12000, and the timeout is sized to match rather than the other way round.
# Observed reasoning on this prompt: 2968 tokens on one run, still unfinished at
# 5997 on another — this build's reasoning length varies widely at temperature 0.7,
# so a budget chosen from a single observation will fail on an unlucky run.
# 12000 / 12 tok/s = 1000 s, inside 80% of the 1300 s timeout.
#
# The honest cost: a single analyst call can take up to ~12 minutes on this
# hardware. That is a real constraint on the architecture, not a tuning detail.
max_tokens = 12000

[models.structuralist]
alias = "qwen/qwen3-4b-2507"
temperature = 0.0
# Sees only the analyst's narrative, never an exhibit, so it needs the least.
# Measured requirement is ~1,450 tokens (1,064 max prompt + 386 completion), so 8192
# leaves 5.6x headroom even allowing for repair attempts. Verified by bracketing.
context_tokens = 8192
# Constrained decoding is applied here only, against the JSON Schema generated
# from the ScenarioSet model (ADR 0002).
#
# NOTE: the verified build of this model is MLX (LM Studio reports its quant as
# "4bit", not "Q4_K_M"). If `map health` reports accepted_not_enforced, suspect
# that first — MLX runtimes have weaker constrained-decoding support than GGUF —
# and try the GGUF build of the same model before touching decode_schema.

# Which prompt version each agent uses. A per-model prompt variant is a change
# here, not a change to mapf.agents — which is what CLAUDE.md §4 says versioning
# is for, and what was not actually true until the agents took the template and
# version as constructor parameters.
# The analyst is on v3 because its worked example is scaled to the forecast
# horizon, and the horizon moved from 21 to 5 trading days (ADR 0016). Horizon and
# worked-example scale are COUPLED and must move together: left at v2, the model
# would anchor on 21-day magnitudes for a 5-day window, which is the units bug of
# 2026-08-12 wearing different clothes. intake and structuralist carry no
# horizon-scaled content and stay at v2.
[prompts]
intake = "v2"
analyst = "v3"
structuralist = "v2"

# ---------------------------------------------------------------------------
# Caches — load-bearing infrastructure, not optimisation (CLAUDE.md §6)
# ---------------------------------------------------------------------------
[cache]
llm_dir = "var/llm"          # namespaced by model fingerprint (ADR 0001)
price_dir = "var/prices"     # parquet, keyed ticker + range + adjustment (ADR 0003)

# ---------------------------------------------------------------------------
# Market data
# ---------------------------------------------------------------------------
[data]
provider_order = ["yfinance", "stooq"]
adjustment = "split_adjusted"   # the single canonical semantic. Adapters
                                         #   normalise into it or fail loudly (ADR 0003)
history_days = 730                       # trailing window fetched for context and charting

[data.sec]
# EDGAR rejects requests without a descriptive User-Agent: 403, plus an IP block of
# roughly ten minutes. It must carry a real name and a real contact address.
# Startup validation REJECTS the placeholder below — replace it before first run.
user_agent = "REPLACE_ME <your.name> <your.email@example.com> M.A.P. research tool"
requests_per_second = 8      # EDGAR's published ceiling is 10/s; leave headroom
tickers_url = "https://www.sec.gov/files/company_tickers_exchange.json"
symbols_db = "var/symbols.sqlite"
refresh_days = 30            # re-download the ticker file when older than this

# ---------------------------------------------------------------------------
# News intake — untrusted input (CLAUDE.md §9)
# ---------------------------------------------------------------------------
[news]
dir = "news"                 # local .txt / .md files
rss_urls = []                # optional; each entry is fetched and treated as untrusted

# ---------------------------------------------------------------------------
# Artifacts
# ---------------------------------------------------------------------------
[paths]
runs_dir = "runs"            # runs/<run_id>/{forecast.json,manifest.json,trace.jsonl,chart.html}
