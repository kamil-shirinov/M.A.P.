[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "map-forecaster"
version = "0.1.0"
description = "Market's Agentic Predictor — calibrated, falsifiable price forecasts from local open-weight models"
readme = "README.md"
# Pinned to a single minor. A research project whose results must be reproducible
# should not silently change interpreter across a backtest.
requires-python = ">=3.12,<3.13"

# Every dependency below is named and justified per CLAUDE.md §2.4.
# Deliberately NOT dependencies (stdlib on 3.12): sqlite3 (symbol index),
# tomllib (config parsing), hashlib (cache keys, document ids), uuid (run ids).
dependencies = [
  # --- mandated by CLAUDE.md §7 ---
  "pydantic>=2.7",          # all schemas and validators; also the single source of the
                            #   JSON Schema handed to constrained decoding (ADR 0002)
  "typer>=0.12",            # CLI
  "httpx>=0.27",            # HTTP to the inference server. Ships MockTransport, so
                            #   testing openai_compat needs no extra mocking library
  "structlog>=24.1",        # structured logging; trace.jsonl is JSON lines

  # --- configuration ---
  "pydantic-settings>=2.2", # BaseSettings was split out of pydantic in v2. Gives the
                            #   TOML-file + env-var overlay with the same validation
                            #   discipline as the domain models

  # --- market data ---
  "pandas>=2.2",            # MarketDataProvider.get_ohlcv returns a DataFrame; both
                            #   upstream providers speak pandas natively
  "pyarrow>=16.0",          # parquet engine for the price cache. Alternative fastparquet
                            #   rejected: pyarrow is what pandas defaults to and what
                            #   Phase 2 will want for columnar reads over many tickers
  "yfinance>=0.2.40",       # primary provider. An unofficial Yahoo scraper, not a
                            #   supported API — see ADR 0003 for why the fallback exists

  # Stooq is the fallback and has NO dependency of its own: it is one CSV endpoint,
  # fetched with httpx and parsed with pandas. pandas-datareader was dropped because it
  # is a thin wrapper over that same URL, intermittently maintained, and sits in the
  # fallback path — which exists precisely because the primary is unreliable. Inheriting
  # a second package's failure modes there defeats the purpose.
  #
  # Symbol search has no dependency either: SQLite FTS5 is in the stdlib and satisfies
  # DoD criterion 2. rapidfuzz was dropped; typo tolerance is deferred to Phase 4.

  # --- news intake ---
  "feedparser>=6.0",        # RSS/Atom dialects are inconsistent in practice. Hand-rolling
                            #   on stdlib xml.etree is brittle across real-world feeds

  # --- evaluation (Phase 2) ---
  "numpy>=1.26",            # vectorised sampling for the Monte Carlo mixture and the
                            #   block bootstrap. Already present transitively via pandas,
                            #   but depending on a transitive dependency implicitly is how
                            #   a build breaks when the intermediary drops it
  "arch>=7.0",              # GARCH(1,1) baseline. Hand-rolling the MLE is ~50 lines and a
                            #   bad idea here: a poorly-fit baseline flatters M.A.P., and
                            #   that failure is invisible in the result
  "scipy>=1.11",            # normal CDF/PDF for the closed-form CRPS. Arrives with arch
                            #   anyway; declared because relying on a transitive dependency
                            #   is how a build breaks when the intermediary drops it

  # --- output ---
  "plotly>=5.22",           # chart.html as a single self-contained file, no server and
                            #   no build step. matplotlib rejected: DoD criterion 8 asks
                            #   for HTML, and interactivity is free here
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",     # ADR 0004 — architecture boundaries fail the build
  "pandas-stubs>=2.2",      # pandas ships no inline types; mypy --strict needs these
]

[project.scripts]
# The command is `map`; the import package is `mapf`. `map` is a builtin and must
# not be an importable top-level package.
map = "mapf.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mapf"]
# Prompt templates are package data under src/mapf/prompts/ and are loaded via
# importlib.resources, so they travel with an installed wheel.

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # builtin shadowing — the `map` trap, enforced
  "C4",       # comprehensions
  "SIM",      # simplify
  "PTH",      # pathlib over os.path
  "RET",      # return consistency
  "T20",      # no print() in library code (CLAUDE.md §7)
  "BLE",      # no bare/blind except (CLAUDE.md §7)
  "TID",      # tidy imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
# typer declares options as call-valued defaults; that is the library's entire
# interface, and B008 cannot distinguish it from the mutable-default bug it exists
# to catch. Confined to the CLI, where typer is the only thing doing it.
"src/mapf/cli/*" = ["B008"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
# Load-bearing, not hygiene (ADR 0005). Without the plugin, BaseModel.__init__ is
# typed **data: Any, so a plain str would satisfy an UntrustedText field and the
# quarantine guarantee would evaporate silently. Must stay enabled.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# These libraries ship no type information. The ignore is confined to the adapter
# modules that wrap them; it must never be widened to first-party code.
[[tool.mypy.overrides]]
module = ["yfinance.*", "plotly.*", "feedparser.*", "pyarrow.*", "arch.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# DoD criterion 6: the suite must pass with the inference server switched off and
# no network. Network-dependent tests are deselected by default and opted into
# explicitly with `pytest -m network`.
addopts = "-m 'not network' --cov=mapf --cov-report=term-missing"
markers = [
  "network: requires live network or a running inference server; excluded by default",
]
# Deprecations are errors. A research project that must still run in three years
# cannot afford to discover a removed API at the moment it is removed; this makes
# the warning arrive while there is still time to act on it.
filterwarnings = ["default::DeprecationWarning", "error::DeprecationWarning:mapf($|\\.)"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# Architecture boundaries — ADR 0004
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "mapf"

[[tool.importlinter.contracts]]
name = "Layered architecture (no cycles, no upward imports)"
type = "layers"
layers = [
  "mapf.cli",
  "mapf.bootstrap",
  "mapf.corpus",
  "mapf.eval",
  "mapf.pipeline",
  "mapf.agents",
  "mapf.render",
  "mapf.providers",
  "mapf.data",
  "mapf.prompts",
  "mapf.settings",
  "mapf.core",
]
# The ordering among render/providers/data is stricter than the real relationship
# (mutual independence). Over-strictness is free here.

[[tool.importlinter.contracts]]
name = "Agents depend on ports, never on adapters or settings"
type = "forbidden"
source_modules = ["mapf.agents"]
forbidden_modules = ["mapf.providers", "mapf.data", "mapf.settings"]

[[tool.importlinter.contracts]]
name = "Pipeline is parameterised by Protocols, never imports adapters"
type = "forbidden"
source_modules = ["mapf.pipeline"]
forbidden_modules = ["mapf.providers", "mapf.data"]

[[tool.importlinter.contracts]]
name = "Evaluation is parameterised by Protocols, never imports adapters"
type = "forbidden"
source_modules = ["mapf.eval"]
forbidden_modules = ["mapf.providers", "mapf.data"]

[[tool.importlinter.contracts]]
name = "Corpus selection is parameterised by Protocols, never imports adapters"
type = "forbidden"
source_modules = ["mapf.corpus"]
forbidden_modules = ["mapf.providers", "mapf.data"]

[[tool.importlinter.contracts]]
name = "Core is a sink"
type = "forbidden"
source_modules = ["mapf.core"]
forbidden_modules = [
  "mapf.agents", "mapf.bootstrap", "mapf.cli", "mapf.data", "mapf.pipeline",
  "mapf.prompts", "mapf.providers", "mapf.render", "mapf.settings", "mapf.corpus",
]
